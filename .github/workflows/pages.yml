name: Seite veröffentlichen

# live  → https://nicjj.github.io/angebote/       nur das Guinness-Spiel (Angebote und Personen gesperrt)
# testing → https://nicjj.github.io/angebote/test/  alle Seiten, noindex
# Beide Fassungen werden bei jedem Lauf gemeinsam gebaut, weil GitHub Pages nur eine Seite je Repo kennt.
on:
  push:
    branches: [testing, live]
  schedule:
    - cron: "17 * * * *" # stündlich neue Angebote holen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    env:
      KAUFDA_ABSTAND_MS: "2000" # kaufDA bittet in robots.txt um 2 s Abstand
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
        with: { ref: live, path: live }
      - uses: actions/checkout@v4
        with: { ref: testing, path: testing }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # Auf live ist vorerst nur das Guinness-Spiel freigegeben (Wunsch vom 03.10.2026).
      # Zum Freigeben weiterer Seiten: hier kopieren, in seiten.json eintragen und aktualisieren.js aufrufen.
      - name: Live-Fassung bauen
        run: |
          mkdir -p _site
          cp live/guinness.html _site/index.html
          cp live/guinness.html _site/guinness.html
          echo '[]' > _site/seiten.json

      - name: Test-Fassung bauen
        run: |
          mkdir -p _site/test
          for f in testing/*.html; do
            sed 's#<head>#<head>\n<meta name="robots" content="noindex">#' "$f" > "_site/test/$(basename "$f")"
          done
          echo '[{"href":"./","name":"Angebote"},{"href":"guinness.html","name":"Guinness-Spiel"}]' > _site/test/seiten.json
          node testing/tools/aktualisieren.js _site/test

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
