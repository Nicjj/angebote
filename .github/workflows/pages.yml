name: Seite veröffentlichen

# live  → https://nicjj.github.io/angebote/       Startseite, Guinness-Spiel, Bilder, Datensätze (Angebote gesperrt)
# testing → https://nicjj.github.io/angebote/test/  alle Seiten, noindex
# Beide Fassungen werden bei jedem Lauf gemeinsam gebaut, weil GitHub Pages nur eine Seite je Repo kennt.
on:
  push:
    branches: [testing, live]
  schedule:
    - cron: "17 * * * *" # stündlich neue Angebote holen
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    env:
      KAUFDA_ABSTAND_MS: "2000" # kaufDA bittet in robots.txt um 2 s Abstand
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
        with: { ref: live, path: live }
      - uses: actions/checkout@v4
        with: { ref: testing, path: testing }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # Auf live freigegeben: Startseite, Guinness-Spiel, Bilder, Datensätze (Stand 04.10.2026).
      # Zum Freigeben weiterer Seiten: Datei hier kopieren und in seiten.json eintragen
      # (seiten.json steuert Menü und anklickbare Kästen der Startseite). Für die Angebote zusätzlich aktualisieren.js aufrufen.
      - name: Live-Fassung bauen
        run: |
          mkdir -p _site
          for f in index guinness bilder personen; do cp "live/$f.html" _site/; done
          echo '[{"href":"./","name":"Start"},{"href":"guinness.html","name":"Guinness-Spiel"},{"href":"bilder.html","name":"Zu den Bildern"},{"href":"personen.html","name":"Datensätze"}]' > _site/seiten.json

      - name: Test-Fassung bauen
        run: |
          mkdir -p _site/test
          for f in testing/*.html; do
            sed 's#<head>#<head>\n<meta name="robots" content="noindex">#' "$f" > "_site/test/$(basename "$f")"
          done
          echo '[{"href":"./","name":"Start"},{"href":"guinness.html","name":"Guinness-Spiel"},{"href":"bilder.html","name":"Zu den Bildern"},{"href":"personen.html","name":"Datensätze"},{"href":"angebote.html","name":"Angebote"}]' > _site/test/seiten.json
          node testing/tools/aktualisieren.js _site/test

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
