<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicks Seite</title>
<style>
  :root {
    --bg: #f4f2ec; --karte: #ffffff; --text: #1b1b1b; --leise: #6b6b66; --linie: #e2e0d8;
    --akzent: #9a7412; --chip: #ecebe4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --karte: #1f1f1d; --text: #f1eee4; --leise: #a29f94; --linie: #33332f;
      --akzent: #d9b44a; --chip: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; min-height: 100%; margin: 0 auto; padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; }
  h1 { font-size: 28px; line-height: 1.15; margin: 0 0 4px; }
  .unter { color: var(--leise); font-size: 15px; margin: 0 0 22px; }

  /* Vier große Kästen, auf dem Handy 2 × 2 */
  .kaesten { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; max-height: 640px; }
  .kasten { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-height: 160px;
    background: var(--karte); border: 1px solid var(--linie); border-radius: 18px; padding: 16px;
    color: var(--text); text-decoration: none; position: relative; -webkit-tap-highlight-color: transparent; }
  a.kasten:active { transform: scale(.98); background: var(--chip); }
  a.kasten:focus-visible { outline: 3px solid var(--akzent); outline-offset: 2px; }
  .kasten svg { width: 40px; height: 40px; color: var(--akzent); }
  .kasten b { display: block; font-size: 19px; line-height: 1.2; }
  .kasten small { display: block; color: var(--leise); font-size: 13px; margin-top: 4px; }
  .kasten.zu { opacity: .45; cursor: not-allowed; }
  .kasten.zu svg { color: var(--leise); }
  .bald { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 700; letter-spacing: .03em;
    text-transform: uppercase; background: var(--chip); color: var(--leise); padding: 3px 8px; border-radius: 999px; }

  @media (min-width: 640px) {
    h1 { font-size: 34px; }
    .kaesten { gap: 16px; }
    .kasten { min-height: 200px; padding: 20px; }
    .kasten b { font-size: 22px; }
    a.kasten:hover { border-color: var(--akzent); }
  }
</style>
</head>
<body>
<main>
  <h1>Hallo!</h1>
  <p class="unter">Wohin soll es gehen?</p>

  <div class="kaesten" id="kaesten">
    <a class="kasten" href="guinness.html" data-seite="guinness.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 3h12l-1.4 17a1 1 0 0 1-1 .9H8.4a1 1 0 0 1-1-.9Z"/><path d="M6.4 8h11.2" /><path d="M7 3c1-1 3-1 5 0s4 1 5 0"/></svg>
      <span><b>Guinness Game</b><small>Punkte, Stand und Kurven</small></span>
    </a>
    <a class="kasten" href="bilder.html" data-seite="bilder.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg>
      <span><b>Zu den Bildern</b><small>Links zu Fotos und Alben</small></span>
    </a>
    <a class="kasten" href="personen.html" data-seite="personen.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17c.6-2 2-3 3.5-3s2.9 1 3.5 3"/><path d="M15 10h3M15 14h3"/></svg>
      <span><b>Datensätze</b><small>Deine Daten für Reisen</small></span>
    </a>
    <a class="kasten" href="angebote.html" data-seite="angebote.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      <span><b>Angebote</b><small>Was gerade im Angebot ist</small></span>
    </a>
  </div>
</main>

<script>
// Freigegeben ist, was in seiten.json steht (legt die Action fest). Alles andere bleibt sichtbar,
// ist aber nicht anklickbar. Ohne Datei (lokaler Server) ist alles freigegeben.
(async () => {
  let seiten = null;
  try { const r = await fetch("seiten.json", { cache: "no-store" }); if (r.ok) seiten = await r.json(); } catch {}
  if (!seiten) return;
  const frei = new Set(seiten.map((s) => s.href));
  for (const a of document.querySelectorAll("[data-seite]")) {
    if (frei.has(a.dataset.seite)) continue;
    a.classList.add("zu");
    a.removeAttribute("href");
    a.setAttribute("aria-disabled", "true");
    a.insertAdjacentHTML("afterbegin", `<span class="bald">Bald</span>`);
  }
})();
</script>
</body>
</html>
